name: Atualizar Dados Diariamente

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-data:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Baixar JSON da Planilha
        run: |
          curl -sL "https://script.google.com/macros/s/AKfycbxrCbQZsAVjMoPzDz-6vuyLKjlMH7m0E1BlIzdtPmgSUYaoBk75O2G0UdWF_uWPD7nE/exec" -o dados.json
          head -n 5 dados.json

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Salvar alterações no repositório
        run: |
          git add dados.json
          git commit -m "bot: dados atualizados" || echo "Nenhuma mudança para commitar"
          git push
